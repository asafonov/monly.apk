apply plugin: 'com.android.application'

android {
    compileSdkVersion 33
    namespace 'org.asafonov.monly'

    defaultConfig {
        applicationId "org.asafonov.monly"
        minSdkVersion 29
        targetSdkVersion 35
        versionCode 53
        versionName "2.15"
    }
    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

dependencies {
    implementation fileTree(dir: 'libs', include: ['*.jar'])
}
